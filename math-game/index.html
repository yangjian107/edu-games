<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<title>20以内加减法</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* 数学游戏特有样式 */
  .num-input {
    font-family: "Comic Sans MS", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  .q-display {
    font-family: "Comic Sans MS", "Segoe UI", "Microsoft YaHei UI", sans-serif;
  }
  /* 题数自定义 */
  .count-box {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: #78909C;
  }
  .count-input {
    width: 56px;
    padding: 6px 4px;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    color: #37474F;
    background: #FFFFFF;
    border: 1px solid #E8E0CC;
    border-radius: 8px;
    outline: none;
  }
  .count-input:focus { border-color: #FF8C42; }
  .count-note {
    font-size: 12px;
    color: #FF8C42;
    text-align: center;
    min-height: 1.2em;
    margin: -14px 0 12px;
  }
  /* 答题版 / 家长陪伴版 分段切换 */
  .top-controls { flex-wrap: wrap; gap: 8px; }
  .seg {
    display: inline-flex;
    background: #F0E8D2;
    border-radius: 18px;
    padding: 3px;
  }
  .seg-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    color: #78909C;
    background: transparent;
    border: none;
    border-radius: 15px;
    padding: 6px 12px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .seg-btn.active {
    background: #FFFFFF;
    color: #37474F;
    box-shadow: 0 1px 4px rgba(180, 160, 120, 0.25);
  }
  /* 家长陪伴版:隐藏输入框,放大算式并垂直居中 */
  .app.parent-mode .question {
    font-size: clamp(44px, 14vw, 68px);
    margin: 0;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app.parent-mode .submit-row { margin-bottom: 28px; }
  .app.parent-mode .question.end-text {
    font-size: clamp(28px, 9vw, 40px);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="top">
      <a href="../index.html" class="back-btn">← 返回大厅</a>
    </div>
    <div class="top top-controls">
      <select id="modeSelect" class="mode-select">
        <option value="10以内加减法" selected>10以内加减法</option>
        <option value="20以内加减法">20以内加减法</option>
        <option value="20以内进位加法">20以内进位加法</option>
        <option value="20以内退位减法">20以内退位减法</option>
      </select>
      <div class="count-box">
        题数
        <input id="countInput" class="count-input" type="text" inputmode="numeric"
               autocomplete="off" pattern="[0-9]*" maxlength="3" value="110">
      </div>
      <div class="seg" id="playSeg">
        <button id="segAnswer" class="seg-btn active" type="button">答题版</button>
        <button id="segParent" class="seg-btn" type="button">家长陪伴版</button>
      </div>
    </div>

    <div class="info">
      <div class="progress-info">题目 <span id="qIdx">1</span> / <span id="qTotal">110</span></div>
      <div class="time-info" id="timeInfo">用时: 00:00</div>
    </div>

    <div class="progress-bar">
      <div class="bar" id="bar" style="width:0%"></div>
    </div>

    <div class="count-note" id="countNote"></div>

    <div class="question q-display" id="question">17 + 3 = ?</div>

    <input id="answer" class="answer-input num-input" type="text" inputmode="numeric"
           autocomplete="off" pattern="[0-9]*" maxlength="3">

    <div class="submit-row">
      <button id="submitBtn" class="btn">提 交</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="bottom-row" id="bottomRow">
      <button id="restartBtn" class="btn green">再来一局</button>
      <button id="reviewBtn" class="btn blue">查看错题</button>
    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-title" id="modalTitle">错题回顾</div>
      <div class="modal-list" id="modalList"></div>
      <div style="text-align:center;">
        <button id="modalCloseBtn" class="btn gray">关 闭</button>
      </div>
    </div>
  </div>

<script src="../assets/game.js"></script>
<script>
"use strict";

const Lib = window.GameLib;
const $ = Lib.$;
const randInt = Lib.randInt;
const AudioSystem = Lib.AudioSystem;
const FxSystem = Lib.FxSystem;
const TimerSystem = Lib.TimerSystem;
const ModalSystem = Lib.ModalSystem;
window.GameLib.bindGlobalEvents();

// ---- 数学游戏配置 ----
const CONFIG = {
  defaultCount: 110,      // 默认题目数
  minCount: 1,
  maxCount: 999,
};

const MODES = {
  "10以内加减法":   { max: 10, type: "any" },
  "20以内加减法":   { max: 20, type: "any" },
  "20以内进位加法": { max: 20, type: "carry_add" },
  "20以内退位减法": { max: 20, type: "borrow_sub" },
};

// ---- 状态 ----
const state = {
  mode: "10以内加减法",
  playMode: "answer",     // "answer"=答题版 | "parent"=家长陪伴版
  total: 0,               // 本局实际题目数
  questions: [],          // 本局题目(乱序、不重复)
  qIndex: 0,
  retries: 0,             // 当前题目答错次数
  wrongTimes: 0,          // 本局累计答错次数
  currentAnswer: 0,
  currentQText: "",
  gameOver: false,
  wrongList: [],          // 需要重做的题(首次答错)
  awaitingNext: false,
  startAt: 0,             // 本局开始时间戳(ms)
  elapsedMs: 0,           // 本局已用时长(ms)
  clockJob: null,         // 总时长刷新任务
};

// ---- DOM ----
const modeSelect = $("modeSelect");
const qIdxEl = $("qIdx");
const qTotalEl = $("qTotal");
const timeInfo = $("timeInfo");
const bar = $("bar");
const questionEl = $("question");
const answerEl = $("answer");
const submitBtn = $("submitBtn");
const feedbackEl = $("feedback");
const bottomRow = $("bottomRow");
const restartBtn = $("restartBtn");
const reviewBtn = $("reviewBtn");
const modalMask = $("modalMask");
const modalTitle = $("modalTitle");
const modalList = $("modalList");
const modalCloseBtn = $("modalCloseBtn");
const countInput = $("countInput");
const countNote = $("countNote");
const segAnswer = $("segAnswer");
const segParent = $("segParent");
const appEl = document.querySelector(".app");

// 切换 答题版 / 家长陪伴版 的界面表现
function applyPlayMode() {
  const parent = state.playMode === "parent";
  appEl.classList.toggle("parent-mode", parent);
  segAnswer.classList.toggle("active", !parent);
  segParent.classList.toggle("active", parent);
  submitBtn.textContent = parent ? "下一题 →" : "提 交";
  answerEl.style.display = parent ? "none" : "";
}

// ---- 生成某模式的全部不重复题目池 ----
function buildPool(modeName) {
  const cfg = MODES[modeName];
  const maxN = cfg.max;
  const t = cfg.type;
  const seen = new Set();
  const pool = [];
  function push(text, ans) {
    if (seen.has(text)) return;
    seen.add(text);
    pool.push({ text: text, answer: ans });
  }
  if (t === "any") {
    for (let a = 0; a <= maxN; a++) {
      for (let b = 0; a + b <= maxN; b++) {
        push(`${a} + ${b} = ?`, a + b);
      }
    }
    for (let a = 0; a <= maxN; a++) {
      for (let b = 0; b <= a; b++) {
        push(`${a} - ${b} = ?`, a - b);
      }
    }
  } else if (t === "carry_add") {
    // 进位加法:两个一位数相加,和满十(即需进位)
    for (let a = 1; a <= 9; a++) {
      for (let b = 10 - a; b <= 9; b++) {
        push(`${a} + ${b} = ?`, a + b);
      }
    }
  } else {
    // 退位减法:十几减一位数,个位不够减(即需退位)
    for (let u = 0; u <= 9; u++) {
      const a = 10 + u;
      for (let b = u + 1; b <= 9; b++) {
        push(`${a} - ${b} = ?`, a - b);
      }
    }
  }
  return pool;
}

// ---- 洗牌(Fisher-Yates) ----
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(0, i);
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ---- 初始化特效与弹窗 ----
FxSystem.init(questionEl, answerEl);
ModalSystem.init(modalMask, modalTitle, modalList, modalCloseBtn);

// ---- 游戏流程 ----
function newRound() {
  // 读取自定义题数
  let n = parseInt(countInput.value, 10);
  if (isNaN(n) || n < CONFIG.minCount) n = CONFIG.defaultCount;
  if (n > CONFIG.maxCount) n = CONFIG.maxCount;

  // 生成不重复题库,随机顺序,取前 n 道
  const pool = buildPool(state.mode);
  if (n > pool.length) {
    countNote.textContent = `该模式共有 ${pool.length} 道不重复题目,已自动调整为 ${pool.length} 题`;
    n = pool.length;
  } else {
    countNote.textContent = "";
  }
  countInput.value = n;

  state.total = n;
  state.questions = shuffle(pool).slice(0, n);
  state.qIndex = 0;
  state.retries = 0;
  state.wrongTimes = 0;
  state.wrongList = [];
  state.gameOver = false;
  state.awaitingNext = false;
  FxSystem.setGameOver(false);
  FxSystem.resetIdx();
  applyPlayMode();
  bottomRow.classList.remove("show");
  submitBtn.style.display = "";
  submitBtn.disabled = false;
  answerEl.disabled = false;
  qTotalEl.textContent = state.total;
  startClock();
  nextQuestion();
}

function nextQuestion() {
  if (state.qIndex >= state.total) {
    finish();
    return;
  }
  const q = state.questions[state.qIndex];
  state.qIndex++;
  qIdxEl.textContent = state.qIndex;
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";

  state.currentQText = q.text;
  state.currentAnswer = q.answer;
  // 家长陪伴版只出示算式本身,去掉末尾的 "= ?"
  questionEl.textContent = state.playMode === "parent"
    ? q.text.replace(/\s*=\s*\?\s*$/, "")
    : q.text;
  questionEl.classList.remove("end-text");

  answerEl.value = "";
  answerEl.disabled = false;
  answerEl.className = "answer-input num-input";
  if (state.playMode !== "parent") {
    setTimeout(() => { if (!state.gameOver) answerEl.focus(); }, 50);
  }

  // 进度条按已作答题目占比显示
  const ratio = state.total ? (state.qIndex / state.total) : 0;
  bar.style.width = (ratio * 100) + "%";
}

// ---- 总用时计时 ----
function fmtTime(ms) {
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

function startClock() {
  stopClock();
  state.startAt = Date.now();
  state.elapsedMs = 0;
  timeInfo.className = "time-info";
  timeInfo.textContent = "用时: 00:00";
  const tick = () => {
    if (state.gameOver) return;
    state.elapsedMs = Date.now() - state.startAt;
    timeInfo.textContent = "用时: " + fmtTime(state.elapsedMs);
    state.clockJob = setTimeout(tick, 500);
  };
  state.clockJob = setTimeout(tick, 500);
}

function stopClock() {
  if (state.clockJob) {
    clearTimeout(state.clockJob);
    state.clockJob = null;
  }
}

function submit() {
  if (state.gameOver || state.awaitingNext) return;

  // 家长陪伴版:系统不判定,直接下一题
  if (state.playMode === "parent") {
    nextQuestion();
    return;
  }

  const raw = answerEl.value.trim();
  if (raw === "") {
    feedbackEl.textContent = "请输入答案";
    feedbackEl.className = "feedback red";
    answerEl.focus();
    return;
  }
  if (!/^-?\d+$/.test(raw)) {
    feedbackEl.textContent = "请输入整数";
    feedbackEl.className = "feedback red";
    return;
  }
  const userAns = parseInt(raw, 10);

  if (userAns !== state.currentAnswer) {
    // 答错:只提醒,不提交,清空让用户重答
    state.wrongTimes++;
    if (state.retries === 0) {
      // 首次答错记录到错题本
      state.wrongList.push({
        q: state.currentQText,
        user: userAns,
        correct: state.currentAnswer,
      });
    }
    state.retries++;
    feedbackEl.textContent = "❌  答案不对,再想想~";
    feedbackEl.className = "feedback red";
    AudioSystem.wrong();
    FxSystem.triggerWrong();
    answerEl.value = "";
    answerEl.focus();
    return;
  }

  // 答对:提交,进入下一题
  state.awaitingNext = true;
  feedbackEl.textContent = "✅  正确!";
  feedbackEl.className = "feedback green";
  AudioSystem.correct();
  FxSystem.triggerCorrect();
  answerEl.disabled = true;
  const resumeDelay = 1000;
  setTimeout(() => {
    state.awaitingNext = false;
    state.retries = 0;
    nextQuestion();
  }, resumeDelay);
}

function finish() {
  state.gameOver = true;
  FxSystem.setGameOver(true);
  stopClock();
  // 定格最终用时
  state.elapsedMs = Date.now() - state.startAt;
  const durationStr = fmtTime(state.elapsedMs);
  FxSystem.clearAll();
  questionEl.textContent = "练习结束";
  questionEl.classList.add("end-text");
  if (state.playMode === "parent") {
    // 家长陪伴版:无判定统计,只列题数和总用时
    feedbackEl.innerHTML = `共 ${state.total} 道题 · 总用时 ${durationStr}`;
  } else {
    const firstRight = state.total - state.wrongList.length;
    const percent = state.total ? Math.floor(firstRight / state.total * 100) : 0;
    let comment;
    if (percent >= 90) comment = "太棒了!";
    else if (percent >= 60) comment = "不错,继续努力!";
    else comment = "加油,多练习会更好!";
    feedbackEl.innerHTML =
      `一次答对 ${firstRight} / ${state.total}(${percent}%)    ${comment}<br>` +
      `答错次数 ${state.wrongTimes}    总用时 ${durationStr}`;
  }
  feedbackEl.className = "feedback";
  timeInfo.textContent = "用时: " + durationStr;
  timeInfo.className = "time-info";
  bar.style.width = "100%";
  answerEl.disabled = true;
  submitBtn.style.display = "none";
  bottomRow.classList.add("show");
  if (state.playMode === "parent") {
    reviewBtn.textContent = "查看题目列表";
    reviewBtn.style.display = "";
  } else {
    reviewBtn.textContent = "查看错题";
    reviewBtn.style.display = state.wrongList.length > 0 ? "" : "none";
  }
}

// 家长陪伴版:按出题顺序列出本局全部算式及答案
function showAllQuestions() {
  modalTitle.textContent = "题目列表  (共 " + state.questions.length + " 题)";
  modalList.innerHTML = "";
  state.questions.forEach((q, i) => {
    const div = document.createElement("div");
    div.className = "modal-item";
    div.innerHTML =
      '<div class="modal-item-q">' + (i + 1) + '.  ' + q.text.replace(/\s*=\s*\?\s*$/, "") + '</div>' +
      '<div class="modal-item-a" style="color:#4CAF50;">答案: ' + q.answer + '</div>';
    modalList.appendChild(div);
  });
  modalMask.classList.add("show");
}

// ---- 事件绑定 ----
submitBtn.addEventListener("click", () => { AudioSystem.ensure(); submit(); });
answerEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    AudioSystem.ensure();
    submit();
  }
});
answerEl.addEventListener("input", (e) => {
  const v = e.target.value;
  const cleaned = v.replace(/[^\d]/g, "");
  if (v !== cleaned) e.target.value = cleaned;
});
modeSelect.addEventListener("change", () => {
  state.mode = modeSelect.value;
  newRound();
});
// 题数输入:只允许数字;回车或失焦时以新题数开始新一局
countInput.addEventListener("input", (e) => {
  const v = e.target.value;
  const cleaned = v.replace(/[^\d]/g, "");
  if (v !== cleaned) e.target.value = cleaned;
});
countInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    // 失焦触发 change 事件,由 change 统一重开一局
    countInput.blur();
    answerEl.focus();
  }
});
countInput.addEventListener("change", () => { newRound(); });
restartBtn.addEventListener("click", () => { AudioSystem.ensure(); newRound(); });
reviewBtn.addEventListener("click", () => {
  if (state.playMode === "parent") showAllQuestions();
  else ModalSystem.showWrong(state.wrongList);
});
// 分段控件:切换答题版/家长陪伴版,立即重开一局
segAnswer.addEventListener("click", () => {
  if (state.playMode === "answer") return;
  state.playMode = "answer";
  newRound();
});
segParent.addEventListener("click", () => {
  if (state.playMode === "parent") return;
  state.playMode = "parent";
  newRound();
});
// 家长陪伴版没有输入框,回车键直接下一题(电脑端快速过题)
// 注意:焦点在按钮上时回车会触发按钮原生 click,此处跳过避免重复前进;
// 焦点在题数输入框时回车用于重开一局,同样跳过。
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || state.playMode !== "parent") return;
  const el = document.activeElement;
  if (el === countInput || (el && el.tagName === "BUTTON")) return;
  e.preventDefault();
  submit();
});

// ---- 启动 ----
newRound();
</script>
</body>
</html>
